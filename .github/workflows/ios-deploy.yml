name: "iOS: Deploy Build"
run-name: Shrubcord iOS build

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        default: ""
        description: "Optional URL override; normally use the DISCORD_IPA_URL secret"
        required: false
        type: string
      release:
        description: "Release the build"
        required: true
        type: boolean
      is_testflight:
        default: false
        description: "TestFlight build"
        required: true
        type: boolean
  workflow_call:
    secrets:
      DISCORD_IPA_URL:
        required: false
    inputs:
      ipa_url:
        required: true
        type: string
      is_testflight:
        required: true
        type: boolean
      release:
        required: false
        type: boolean
        default: true
      caller_workflow:
        required: false
        type: string

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-tweak:
    runs-on: macos-15

    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Randomblock1/theos-action@v1

      - name: Set GNU Make path
        run: |
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Cache Kotlin/Native
        id: konan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: bundle/.dvmrc
          cache: true
          cache-hash: ${{ hashFiles('bundle/deno.lock', 'bundle/.dvmrc') }}

      - name: Identify Apple toolchain
        id: apple-toolchain
        run: echo "digest=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache native compilation outputs
        uses: actions/cache@v4
        with:
          path: core/build
          key: core-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.digest }}-${{ hashFiles('core/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'ios/Makefile') }}
          restore-keys: core-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.digest }}-

      - name: Build packages
        run: ./gradlew :ios:packageTweak --build-cache --parallel --stacktrace

      - name: Verify native core bindings
        run: |
          binary=$(find ios/.theos/obj -name ValencedTweak.dylib -print -quit)
          test -n "$binary" && test -s "$binary"
          nm -u "$binary" > "$RUNNER_TEMP/undefined-symbols.txt"
          if grep 'ValencedCore_' "$RUNNER_TEMP/undefined-symbols.txt"; then
            echo "::error::Unresolved Kotlin C entry points would crash at launch."
            exit 1
          fi
          nm -gU "$binary" > "$RUNNER_TEMP/defined-symbols.txt"
          grep '_ValencedCore_PluginStatesDefaultsBoot' "$RUNNER_TEMP/defined-symbols.txt"

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          path: |
            ios/.theos/obj/**/*.dSYM/**
            ios/.theos/obj/**/ValencedTweak.dylib
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Preserve Kotlin toolchain downloads
        if: ${{ always() && !cancelled() && steps.konan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

      - name: Verify rootless package
        run: |
          set -- ios/packages/*-arm64.deb
          test "$#" -eq 1 && test -s "$1"

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: rootless package
          path: ios/packages/*-arm64.deb
          if-no-files-found: error
          compression-level: 0

  build-ipa:
    if: inputs.caller_workflow != 'ci'
    runs-on: macos-15
    needs: build-tweak
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download Discord IPA
        env:
          IPA_URL: ${{ secrets.DISCORD_IPA_URL || inputs.ipa_url }}
        run: |
          if [ -z "$IPA_URL" ]; then
            echo "::error::Set the DISCORD_IPA_URL repository secret to a fresh decrypted IPA URL."
            exit 1
          fi
          echo "::add-mask::$IPA_URL"
          if ! curl --fail --location --silent --retry 2 --proto '=https' --proto-redir '=https' --output discord.ipa "$IPA_URL"; then
            echo "::error::IPA download failed; check or renew DISCORD_IPA_URL."
            exit 1
          fi
          unzip -tq discord.ipa > /dev/null

      - name: Clone OpenInDiscord
        uses: actions/checkout@v4
        with:
          repository: castdrian/OpenInDiscord
          path: OpenInDiscord

      - name: Build Safari Extension
        run: |
          cd OpenInDiscord
          xcodebuild build \
            -target "OpenInDiscord Extension" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="build" \
            PRODUCT_NAME="OpenInDiscord" \
            PRODUCT_BUNDLE_IDENTIFIER="com.shrubhub.shrubcord.OpenInDiscord" \
            PRODUCT_MODULE_NAME="OpenInDiscordExt" \
            SKIP_INSTALL=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | xcbeautify

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' ios/control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' ios/control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' ios/control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cyan
        run: |
          python -m venv "$RUNNER_TEMP/cyan"
          echo "$RUNNER_TEMP/cyan/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cyan/bin/pip" install --disable-pip-version-check https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip Pillow

      - name: Inject tweak and extension
        run: |
          cyan -uwsgq -i discord.ipa -o ${{ env.APP_NAME }}.ipa -f ${{ env.ROOTLESS_DEB_FILE_NAME }} OpenInDiscord/build/OpenInDiscord.appex

      - name: Set Shrubcord identity
        run: python3 scripts/brand_ipa.py "${{ env.APP_NAME }}.ipa"

      - name: Upload ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ env.APP_NAME }}.ipa
          if-no-files-found: error
          compression-level: 0

  release-app:
    if: |
      inputs.caller_workflow != 'ci' &&
      (github.event.inputs.release == 'true' || inputs.release == true)
    runs-on: ubuntu-latest
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' ios/control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' ios/control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' ios/control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract Discord Version
        env:
          IS_TESTFLIGHT: ${{ inputs.is_testflight }}
        run: |
          python3 - <<'PY'
          import glob, os, plistlib, zipfile
          with zipfile.ZipFile(os.environ["APP_NAME"] + ".ipa") as archive:
              paths = [n for n in archive.namelist() if n.startswith("Payload/") and n.count("/") == 2 and n.endswith(".app/Info.plist")]
              if len(paths) != 1:
                  raise ValueError("Expected one app Info.plist")
              info = plistlib.loads(archive.read(paths[0]))
          version = info["CFBundleShortVersionString"]
          prerelease = os.environ["IS_TESTFLIGHT"].lower() == "true"
          if prerelease:
              version += "_" + info["CFBundleVersion"]
          if not all(c.isalnum() or c in "._-" for c in version):
              raise ValueError("Invalid release version")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"DISCORD_VERSION={version}\nIS_PRERELEASE={str(prerelease).lower()}\n")
          PY

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shrubcord-${{ env.DISCORD_VERSION }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Shrubcord ${{ env.DISCORD_VERSION }} (build ${{ github.run_number }})
          files: |
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}.ipa
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: true
          token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

