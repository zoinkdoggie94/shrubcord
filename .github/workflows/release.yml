name: Shrubcord Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: shrubcord-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ios:
    uses: ./.github/workflows/ios-deploy.yml
    with:
      ipa_url: ""
      is_testflight: false
      release: true
    secrets: inherit
